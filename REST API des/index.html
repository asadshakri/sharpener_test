<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 style="text-align: center;">Restaurant Food Order</h1>
    <br>
    <div style="background-color: bisque; padding: 10px; border-radius: 5px; margin: auto; border: 2px solid;">
        <form onsubmit="handleSubmit(event)">
            <label for="price">Choose Price:</label>
            <input type="number" id="price" name="price">
            <label for="dish">Choose Dish:</label>
            <input type="text" id="dish" name="dish">
            <label for="table">Choose a Table:</label>
            <select id="table" name="table">
                <option value="Choose" disabled selected>Select a table</option>
                <option value="Table 1">Table 1</option>
                <option value="Table 2">Table 2</option>
                <option value="Table 3">Table 3</option>
            </select>
            <button type="submit">Add to Bill</button>
        </form>
    </div>
    <br><br>
    <div style="background-color: bisque; padding: 10px; border-radius: 5px; margin: auto; border: 2px solid;">
        <h2>Orders</h2>
        <ul id="Table 1"><h3>Table 1</h3></ul>
        <ul id="Table 2"><h3>Table 2</h3></ul>
        <ul id="Table 3"><h3>Table 3</h3></ul>
    </div>
    
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
<script src="index.js"></script>
</html>
